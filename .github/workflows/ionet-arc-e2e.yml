name: io.net Arc E2E demo

on:
  pull_request:
    paths:
      - 'showcases/ionet_arc/**'
      - 'contracts/**'
      - '.github/workflows/ionet-arc-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r showcases/ionet_arc/requirements-dev.txt
      - name: Install Foundry and contract dependencies
        run: |
          export FOUNDRY_DIR="$HOME/.foundry"
          curl -fsSL https://foundry.paradigm.xyz -o /tmp/foundry-install.sh
          bash /tmp/foundry-install.sh
          "$HOME/.foundry/bin/foundryup" --install v1.8.4
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          npm ci --prefix contracts --ignore-scripts
      - name: Run end-to-end showcase tests
        run: python -m unittest showcases.ionet_arc.test_demo_e2e -v
