[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules", "vendor"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
fs_permissions = [{ access = "read", path = "../artifacts" }, { access = "read", path = "test/fixtures" }]

[profile.default.fuzz]
runs = 256

# Halmos executes constructors itself; Foundry's dynamic deployCode linking is
# not supported. Keep symbolic artifacts separate from ordinary test builds.
[profile.formal]
dynamic_test_linking = false
out = "out-formal"
cache_path = "cache-formal"
