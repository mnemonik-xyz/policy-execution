name: Build io.net Arc transcription image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mnemonik-xyz/warrant-transcription

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CUDA image for Linux amd64
        uses: docker/build-push-action@v6
        with:
          context: showcases/ionet_arc
          file: showcases/ionet_arc/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:pilot

      - name: Build and push CPU image for Apple Silicon Macs
        uses: docker/build-push-action@v6
        with:
          context: showcases/ionet_arc
          file: showcases/ionet_arc/Dockerfile.arm64
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:pilot-arm64
