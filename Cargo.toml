[workspace]
members = ["core", "methods", "host", "verified", "solver-cli", "swap-verified", "swap-core"]
default-members = ["core"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
bincode = "1.3.3"
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "std"] }
risc0-zkvm = { version = "=3.0.5", default-features = false }

[profile.release]
debug = 1
# The prover runs separately; disable native ThinLTO to avoid linker symbol loss.
lto = false

# Avoid cross-codegen-unit symbol loss in the Verus procedural macro build.
# This affects native build tools, not the separately configured zkVM guests.
[profile.release.package.verus_builtin_macros]
codegen-units = 1
