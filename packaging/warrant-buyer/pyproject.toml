# Template for the warrant-buyer wheel. scripts/build-buyer-wheel.sh stages the sources of
# showcases/ionet_arc next to this file as warrant_buyer/, fills in @VERSION@ and builds a wheel
# that carries the two compiled helper binaries for one platform.
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "warrant-buyer"
version = "@VERSION@"
description = "Buyer guardrail for Warrant: an AI agent buys compute with USDC on Arc and holds no key that can pay."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See LICENSE" }
dependencies = [
  "mcp==2.3.0",
  "httpx2[socks]==2.13.1",
  "jsonschema==4.26.0",
  "eth-abi==6.0.0",
  "eth-account==0.14.0",
  "pyyaml==6.0.3",
]

[project.urls]
Source = "https://github.com/mnemonik-xyz/policy-execution"

[project.scripts]
warrant-buyer = "warrant_buyer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["warrant_buyer"]
artifacts = ["warrant_buyer/bin/*"]
