[project]
name = "warrant-ledger"
version = "0.1.0"
description = "Books Warrant InvoiceEscrow events into the buyer's ledger"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
beancount = ["beancount==3.2.3"]

[project.scripts]
warrant-ledger = "warrant_ledger.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["warrant_ledger*"]
