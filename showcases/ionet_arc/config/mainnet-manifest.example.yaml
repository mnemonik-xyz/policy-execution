# Example seller manifest for Arc mainnet (chain 5042). This file contains no secret.
# The real manifest config/mainnet-manifest.yaml is rendered on the VM by the deploy-seller step and is not in git.
# Replace the placeholder addresses with the deployed TaskEscrow, the JournalVerifier and the seller payout wallet.
# The seller refuses to start on RPC chain 5042 when chain_id here is missing or different.

chain_id: 5042  # Arc mainnet; must equal the chain that the RPC reports
rpc_url: 'https://rpc.mainnet.arc.io'  # Arc mainnet JSON-RPC
escrow_address: '0x0000000000000000000000000000000000000000'  # Placeholder: deployed no-proof TaskEscrow
verifier_address: '0x0000000000000000000000000000000000000000'  # Placeholder: JournalVerifier (test double)
token_address: '0x3600000000000000000000000000000000000000'  # Arc USDC (6 decimals)
seller_address: '0x0000000000000000000000000000000000000000'  # Placeholder: seller payout wallet
# No buyer_address: each buyer sends its own customer_address to propose_deployment.
category: 42  # Accredited GPU Whisper transcription service
max_budget_usd: 1.00  # $1.00 maximum per deal; the seller also enforces this cap on chain 5042
duration_hours: 1  # GPU container lease duration; the seller accepts only 1 hour on chain 5042
validity_seconds: 900  # 15 minutes per-request escrow settlement deadline
vendor_validity_days: 365  # 1-year Registry Authority credential lifetime

public_files:
  # Generated by init.py --manifest using the registry key; published with the mainnet- prefix:
  public_keys: showcases/ionet_arc/config/mainnet-public_keys.yaml
  vendor_credential: showcases/ionet_arc/config/mainnet-vendor_credential.yaml
  vendor_signature: showcases/ionet_arc/config/mainnet-vendor_signature.yaml

private_key_files:
  # Checkout-relative paths under the gitignored .keys/ directory; never committed:
  registry_key: showcases/ionet_arc/.keys/mainnet-registry.key  # Signs vendor credentials (secp256k1)
  buyer_acceptance_key: showcases/ionet_arc/.keys/mainnet-buyer_acceptance.key  # Deleted after init on the VM
  # Absolute path inside the seller container; the host file is mounted read-only:
  seller_key: /run/secrets/seller.key  # Seller transaction key (hex)
