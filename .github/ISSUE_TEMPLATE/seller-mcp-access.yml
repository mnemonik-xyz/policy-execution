name: Request seller MCP access
description: Ask for the basic-auth credential of the Arc mainnet seller MCP, or send feedback after trying it.
title: "Seller MCP access: <your name or project>"
labels: ["seller-access"]
body:
  - type: markdown
    attributes:
      value: |
        The seller MCP at `https://seller.mnemonik.xyz/mcp` is protected by basic auth. The operator
        reviews each request and sends the credential privately.

        **Never post a password, a private key or a seed phrase in this issue.** The issue is public.
        Do not share a wallet key; the address is enough.
  - type: input
    id: contact
    attributes:
      label: Private contact
      description: How the operator can reach you to hand over the credential (for example an email address or a Telegram handle). Leave it out here if you prefer to be contacted through GitHub.
    validations:
      required: false
  - type: textarea
    id: use_case
    attributes:
      label: What do you want to try?
      description: For example a quote check from a desktop agent, a full paid test, or a review of the contracts.
    validations:
      required: true
  - type: input
    id: wallet
    attributes:
      label: Customer wallet address on Arc mainnet (chain 5042)
      description: Public address only, `0x` followed by 40 hex digits. Needed for a quote.
      placeholder: "0x..."
    validations:
      required: false
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Desktop
        - Cursor
        - Another MCP client
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Please confirm
      options:
        - label: I understand that the mainnet seller path has not run with real money yet, that deals are capped at 1 USD, and that the verifier is a test double that checks no proof.
          required: true
        - label: I will not share the credential with others.
          required: true
  - type: textarea
    id: feedback
    attributes:
      label: Feedback (optional)
      description: What worked, what did not, what was unclear in the README. Remove any credential before you post.
    validations:
      required: false
