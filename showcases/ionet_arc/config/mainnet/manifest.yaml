# Mainnet canary manifest for TaskEscrow on Arc mainnet (chain ID 5042).
# Status: NOT DEPLOYED. The address and image fields are empty until Phase 3 of
# docs/product/mainnet-canary-plan.md fills them from the deployment manifest.
# Every value here is public. Private keys live only in the files under private_key_files,
# with mode 0600, outside version control.

chain_id: 5042  # Arc mainnet
rpc_url: 'https://rpc.mainnet.arc.io'  # Arc mainnet JSON-RPC
escrow_address: ''  # TaskEscrow, filled after Deploy.s.sol and the check-arc.py verify phase
verifier_address: ''  # RiscZeroGroth16Verifier created by Deploy.s.sol, filled after deployment
guest_image_id: ''  # warrant-host image-id from a RISC0_USE_DOCKER=1 build; must equal TaskEscrow.imageId()
token_address: '0x3600000000000000000000000000000000000000'  # Arc USDC (6 decimals)
seller_address: ''  # Seller payout wallet, a dedicated low-balance hot key
buyer_address: ''  # Buyer wallet, a dedicated low-balance hot key
category: 42  # Accredited GPU Whisper transcription service
max_budget_usd: 2.00  # Order cap; the buyer guardrail refuses a larger proposal
duration_hours: 1  # GPU container lease duration
validity_seconds: 7200  # 2 hours: policy valid_until and TaskEscrow settleBy; the proof must land before it
vendor_validity_days: 365  # Registry Authority credential lifetime
settlement: proof  # Real RISC Zero Groth16 proof; mock settlement is refused on chain 5042

# Worker image pinned by digest. Read from GHCR on 2026-10-13 for the mutable tag :pilot.
# Re-read the digest at deploy time and record the value used in the deployment manifest.
worker_image: 'ghcr.io/mnemonik-xyz/warrant-transcription@sha256:08e42fc4f0a55fc478bdd31c65bbf5c72b2bfe1984e780283b53d62d7b700481'

public_files:
  # Generated by: python3 showcases/ionet_arc/init.py --manifest showcases/ionet_arc/config/mainnet/manifest.yaml
  public_keys: showcases/ionet_arc/config/mainnet/public_keys.yaml
  vendor_credential: showcases/ionet_arc/config/mainnet/vendor_credential.yaml
  vendor_signature: showcases/ionet_arc/config/mainnet/vendor_signature.yaml

private_key_files:
  registry_key: showcases/ionet_arc/.keys/mainnet/registry.key  # Signs vendor credentials (secp256k1)
  buyer_acceptance_key: showcases/ionet_arc/.keys/mainnet/buyer_acceptance.key  # Signs buyer acceptance
  seller_key: showcases/ionet_arc/.keys/mainnet/seller.key  # Seller transaction key, mode 0600
  buyer_key: showcases/ionet_arc/.keys/mainnet/buyer.key  # Buyer transaction key, mode 0600
