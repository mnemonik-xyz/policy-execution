# Master showcase manifest linking deployed contracts, policy template, and credentials.
# Note: vendor_credential.yaml, vendor_signature.yaml, and public_keys.yaml are generated by init.py.

chain_id: 5042002  # Arc Testnet
escrow_address: '0x9449C1fDd068cDe33D900b1ab15f9861dc39bC51'  # Deployed TaskEscrow contract
verifier_address: '0x0932F120DEe4cA83676B8224769eE52b7d6D00c6'  # RiscZeroGroth16Verifier contract
token_address: '0x3600000000000000000000000000000000000000'  # Arc USDC (6 decimals)
seller_address: '0x9F188809b2ba2e29653693C4069c212a95C1B8c4'  # io.net seller payout wallet
category: 42  # Accredited GPU Whisper transcription service
max_amount: 2000000  # 2.00 USDC spending cap in atomic units
duration_hours: 1  # GPU container lease duration
validity_seconds: 900  # 15 minutes per-request escrow settlement deadline
vendor_validity_days: 365  # 1-year Registry Authority credential lifetime

public_files:
  manifest: showcases/ionet_arc/config/manifest.yaml
  buyer_policy_template: showcases/ionet_arc/config/buyer_policy_template.yaml
  public_keys: showcases/ionet_arc/config/public_keys.yaml
  # Generated by init.py using registry.key:
  vendor_credential: showcases/ionet_arc/config/vendor_credential.yaml
  vendor_signature: showcases/ionet_arc/config/vendor_signature.yaml

private_key_files:
  registry_key: showcases/ionet_arc/.keys/registry.key  # Signs vendor credentials (secp256k1)
  buyer_acceptance_key: showcases/ionet_arc/.keys/buyer_acceptance.key  # Signs buyer acceptance
